apiVersion: v1
kind: ConfigMap
metadata:
  name: monticker-config
  namespace: monticker
data:
  DB_URL: "jdbc:postgresql://postgres:5432/monticker"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka:9092"
  INGESTION_SOURCE: "internal"
  # ADR-040 — Kafka 토픽 파티션/복제 (backend/api KafkaTopicConfig가 읽는다). base = 초기 상용(T1).
  # T2 목표(market.ticks 256 등)는 ADR-040 §3 표. 복제 계수 3은 멀티 브로커 전환 후.
  KAFKA_REPLICATION_FACTOR: "1"
  KAFKA_PARTITIONS_MARKET_TICKS: "64"
  KAFKA_PARTITIONS_TICK_PROCESSED: "32"
  KAFKA_PARTITIONS_MARKET_EVENTS: "16"
  KAFKA_PARTITIONS_TRADING: "16"
  KAFKA_PARTITIONS_RETRY: "4"
  # ADR-043 — 일일 원장 대사(17:30 KST)의 불일치 처리. 코드 기본값은 alert(ERROR + LedgerMismatch 페이지).
  # 최초 배포는 report: 대사가 한 번도 돈 적이 없으니 기존 드리프트가 나올 수 있다 — 조사·정리 후 alert로
  # (human-action-items §3). report 모드에서도 카운터는 mode="report"로 올라가 Grafana에서 보인다.
  LEDGER_RECON_MODE: "report"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
  PINPOINT_ENABLE: "false"
  PINPOINT_COLLECTOR_IP: "pinpoint-collector"
  # (ADR-048/049: trading-service·quant-engine 위임 URL은 제거됐다 — 두 서비스 모두 api가 위임을 연결한 적이 없었다)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-gateway-config
  namespace: monticker
data:
  KAFKA_BROKERS: "kafka:9092"
  DB_URL: "postgres://monticker:monticker@postgres:5432/monticker?sslmode=disable"
