# 민감한 값은 base64 인코딩 필요: echo -n "value" | base64
# 실제 배포 전 반드시 값을 교체하거나 External Secrets Operator 사용
apiVersion: v1
kind: Secret
metadata:
  name: monticker-secrets
  namespace: monticker
type: Opaque
stringData:
  DB_USER: "monticker"
  DB_PASSWORD: "monticker"
  ANTHROPIC_API_KEY: ""
  NAVER_CLIENT_ID: ""
  NAVER_CLIENT_SECRET: ""
  DART_API_KEY: ""
  KIS_APP_KEY: ""
  KIS_APP_SECRET: ""
  MAIL_HOST: ""
  MAIL_PORT: "587"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_FROM: "noreply@monticker.io"
  APP_BASE_URL: "https://monticker.io"
  ALLOWED_ORIGINS: "https://monticker.io,https://app.monticker.io"
