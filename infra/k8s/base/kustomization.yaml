apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monticker

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - api.yaml
  # 워커는 역할 분리 배포(market/event/alert)만 둔다. role=all `worker`를 함께 올리면
  # Mock 시세 생산과 커버리지 공표가 중복된다 — docker-compose의 msa 프로필과 같은 규칙.
  - web.yaml
  - market-gateway.yaml
  - worker-market.yaml
  - worker-event.yaml
  - worker-alert.yaml
  - jaeger.yaml
  - ingress.yaml
  - pdb.yaml
  - db-backup.yaml
  - scaling-schedule.yaml
  # 관측 스택 — 규칙·대시보드가 docker-compose와 단일 소스라 infra/monitoring/ 을 루트로 둔다
  - ../../monitoring
