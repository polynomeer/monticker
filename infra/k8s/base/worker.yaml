apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: monticker
  labels:
    app: worker
spec:
  # worker는 @Scheduled + Kafka Consumer — 병렬 실행 시 중복 이벤트 가능
  # Kafka partition 수(6)를 넘지 않도록 제한
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: monticker/worker:latest
          envFrom:
            - configMapRef:
                name: monticker-config
            - secretRef:
                name: monticker-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
