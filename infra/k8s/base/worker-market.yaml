apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-market
  namespace: monticker
  labels:
    app: worker-market
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-market
  template:
    metadata:
      labels:
        app: worker-market
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: worker-market
          image: monticker/worker:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: monticker-config
            - secretRef:
                name: monticker-secrets
          env:
            # WORKER_ROLE 환경변수로 단일 이미지에서 역할을 분기한다
            - name: WORKER_ROLE
              value: market
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: worker-market
  namespace: monticker
spec:
  selector:
    app: worker-market
  ports:
    - port: 8081
      targetPort: 8081
