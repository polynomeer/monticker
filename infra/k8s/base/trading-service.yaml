# trading-service: paper / matching / wallet 전용 서비스 (MSA Stage 5)
# api의 TRADING_SERVICE_URL 환경변수가 설정되면 요청이 이 서비스로 위임된다.
# 체결/취소 이벤트를 @TransactionalEventListener(AFTER_COMMIT) 로 Kafka에 발행한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-service
  namespace: monticker
  labels:
    app: trading-service
spec:
  # replica는 반드시 1이어야 한다. OrderBookService가 종목별 호가창(TreeMap)을 pod 메모리에
  # 들고 있어, replica가 2면 지정가 주문이 받은 pod에만 남고 다른 pod로 라우팅된 반대 주문과
  # 절대 체결되지 않는다. 낙관적 락은 DB 행을 보호할 뿐 인메모리 호가창을 합쳐주지 않는다.
  # 수평 확장은 stockId 샤딩(scale-out-plan §6.8, ADR 예정) 이후에만 가능하다.
  replicas: 1
  strategy:
    type: Recreate   # 롤링 배포 중 두 pod가 잠시 공존하는 것도 같은 이유로 막는다
  selector:
    matchLabels:
      app: trading-service
  template:
    metadata:
      labels:
        app: trading-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: trading-service
          image: monticker/trading-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: monticker-config
            - secretRef:
                name: monticker-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: trading-service
  namespace: monticker
spec:
  selector:
    app: trading-service
  ports:
    - port: 8083
      targetPort: 8083
