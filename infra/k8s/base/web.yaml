apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: monticker
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # resilience-plan §D3 / P0-7 — replica가 한 노드/존에 몰리지 않게 한다.
      # 이 설정이 없으면 노드 1대 손실이 전면 장애가 된다. ScheduleAnyway: 노드가 1개뿐인
      # dev 클러스터에서도 스케줄은 되게 하고, 가능한 곳에서만 분산한다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
      containers:
        - name: web
          image: monticker/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://api:8080"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: monticker
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
