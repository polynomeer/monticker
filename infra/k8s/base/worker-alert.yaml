apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-alert
  namespace: monticker
  labels:
    app: worker-alert
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-alert
  template:
    metadata:
      labels:
        app: worker-alert
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: worker-alert
          image: monticker/worker:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: monticker-config
            - secretRef:
                name: monticker-secrets
          env:
            - name: WORKER_ROLE
              value: alert
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: worker-alert
  namespace: monticker
spec:
  selector:
    app: worker-alert
  ports:
    - port: 8081
      targetPort: 8081
