apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monticker-ingress
  namespace: monticker
  annotations:
    # ── Gateway: Rate Limiting ────────────────────────────────────────────────
    # IP당 초당 요청 수 제한 (burst 허용). 앱 레벨 RateLimitFilter와 2-tier 방어.
    nginx.ingress.kubernetes.io/limit-rps: "60"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"

    # ── Gateway: Timeout ──────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # WebSocket 유지
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # ── Gateway: WebSocket upgrade ────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

    # ── Gateway: Body size ────────────────────────────────────────────────────
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"

    # ── Gateway: Security & Observability headers ─────────────────────────────
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Request ID: 클라이언트가 보낸 값 우선, 없으면 NGINX가 생성한 $request_id 사용
      set $req_id $request_id;
      if ($http_x_request_id != '') {
        set $req_id $http_x_request_id;
      }
      proxy_set_header X-Request-Id $req_id;
      add_header     X-Request-Id $req_id always;

      # Security headers
      add_header X-Content-Type-Options  "nosniff"           always;
      add_header X-Frame-Options         "DENY"              always;
      add_header Referrer-Policy         "strict-origin"     always;

      # Upstream 정보 노출 차단
      proxy_hide_header X-Powered-By;
      proxy_hide_header Server;

      # Real IP 전달 (RateLimitFilter가 정확한 IP를 보도록)
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket upgrade
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

    # ── Gateway: CORS (Ingress 수준 처리) ─────────────────────────────────────
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://monticker.io,https://www.monticker.io,http://localhost:3000"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Request-Id, X-Idempotency-Key"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"

spec:
  ingressClassName: nginx
  rules:
    - host: monticker.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
