apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # dev: 단일 replica로 리소스 절약
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: api
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: web

images:
  - name: monticker/api
    newTag: dev
  - name: monticker/worker
    newTag: dev
  - name: monticker/web
    newTag: dev
  - name: monticker/market-gateway
    newTag: dev
