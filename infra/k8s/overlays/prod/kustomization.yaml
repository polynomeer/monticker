apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # prod: HPA 최소 replica를 3으로 상향
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
      name: api-hpa
  # prod: 개장 전 예약 스케일업 값(P1-4). BASE는 위 minReplicas와 같아야 장 마감 후 원복이 맞다.
  - patch: |-
      - op: replace
        path: /data/PREOPEN_MIN_REPLICAS
        value: "6"
      - op: replace
        path: /data/BASE_MIN_REPLICAS
        value: "3"
    target:
      kind: ConfigMap
      name: scaling-schedule
  # docs/security-review.md P2-2 — base는 TLS 없는 로컬 host(monticker.local)를 그대로 둔다
  # (kubectl port-forward/로컬 HTTP 테스트가 막히면 안 되므로). 실제 도메인·TLS 강제는
  # prod에서만 켠다. monticker-tls Secret은 secret.yaml과 같은 원칙 — 여기엔 없고 실배포
  # 전에 cert-manager(권장) 또는 수동 발급으로 반드시 채워야 한다.
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: monticker.io
      - op: add
        path: /spec/tls
        value:
          - hosts: ["monticker.io"]
            secretName: monticker-tls
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "true"
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1force-ssl-redirect
        value: "true"
    target:
      kind: Ingress
      name: monticker-ingress

images:
  - name: monticker/api
    newTag: "1.0.0"
  - name: monticker/worker
    newTag: "1.0.0"
  - name: monticker/web
    newTag: "1.0.0"
  - name: monticker/market-gateway
    newTag: "1.0.0"
  - name: monticker/db-backup
    newTag: "1.0.0"
