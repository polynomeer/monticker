# Prometheus가 같은 네임스페이스의 pod를 발견(kubernetes_sd)하기 위한 최소 권한.
# ClusterRole이 아니라 Role — 이 네임스페이스 밖은 볼 필요가 없다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monticker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: monticker
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: monticker
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monticker
roleRef:
  kind: Role
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
