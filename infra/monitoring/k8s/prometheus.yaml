apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monticker
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi          # 15일 보관 × 현재 시리즈 수 기준 여유. 늘어나면 Thanos(scale-out-plan §6.11)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monticker
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate         # PVC가 RWO라 두 pod가 동시에 붙을 수 없다
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534       # prometheus 이미지의 nobody — PVC 쓰기 권한
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle          # ConfigMap 갱신 후 POST /-/reload
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits:   { cpu: "1",    memory: "2Gi" }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monticker
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
