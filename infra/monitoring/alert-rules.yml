# monticker 알람 규칙 — docker-compose(prometheus.yml)와 K8s(infra/monitoring/kustomization.yaml)가
# 같은 파일을 쓴다. resilience-plan §4.5의 3계층:
#
#   severity: critical → Page  (사람을 깨운다. 사용자가 지금 아프다)
#   severity: warning  → Ticket(업무시간 대응. 곧 아프다)
#   그 외             → 대시보드에만 (알람 아님)
#
# 원칙: 알람은 증상(사용자가 겪는 것)에 건다. "CPU 80%"는 알람이 아니라 대시보드 항목이다.
# 사용자가 아프지 않으면 깨우지 않는다 — 신뢰를 잃은 신호는 신호가 아니다.
#
# 메트릭 출처: Spring Boot Actuator(Micrometer) + resilience4j-micrometer + 이 저장소가 직접 등록한
# 카운터(redis_command_failed_total, search_fallback_total, candle_flush_failed_total,
# alert_rule_eval_failed_total, dlt_messages_total, ws_active_connections, outbox_pending,
# saga_incomplete). 규칙을 추가할 때는 그 메트릭이 실제로 노출되는지 먼저 확인할 것 —
# 존재하지 않는 메트릭에 건 알람은 영원히 조용하다. 실제로 그랬다: 게이지를 `_total`로 등록하면 Micrometer가
# 접미사를 떼고 노출해 OutboxBacklog·SagaIncomplete가 빈 시계열을 보고 있었다(2026-09-14, 대시보드 작업 중 발견).
# 검증: infra/monitoring/check-metrics.py 가 규칙·대시보드의 메트릭 이름을 실제 /actuator/prometheus 출력과 대조한다.

groups:
  # ───────────────────────────── Page ─────────────────────────────
  - name: monticker-page
    rules:
      - alert: AllReplicasDown
        # 단일 pod 다운은 K8s가 처리한다. 사용자가 아픈 건 전부 죽었을 때다.
        expr: |
          sum by (job) (up{job="monticker-api"}) == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} 전 replica 다운"
          description: "{{ $labels.job }}의 모든 인스턴스가 1분 이상 스크레이프에 응답하지 않습니다. 사용자에게 서비스가 보이지 않는 상태입니다."

      - alert: ApiErrorBudgetBurn
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{application="monticker-api", status=~"5.."}[5m]))
          /
          sum by (application) (rate(http_server_requests_seconds_count{application="monticker-api"}[5m]))
          > 0.01
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "API 5xx 비율 1% 초과"
          description: "지난 5분간 5xx 비율 {{ $value | humanizePercentage }}. 조회 SLO(99.9%)의 에러버짓을 빠르게 소진 중입니다."

      - alert: ApiLatencyHigh
        # application.yml의 percentiles-histogram 설정이 있어야 버킷이 노출된다.
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{application="monticker-api", uri!~"/actuator.*"}[5m]))
          ) > 0.5
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "API p95 지연 500ms 초과"
          description: "10분 이상 p95 {{ $value | humanizeDuration }}. 조회 SLO(p95 < 200ms)의 2.5배입니다."

      - alert: OrderPathDown
        # 실제 돈이 움직이는 엔드포인트만 따로 본다. 전체 5xx 비율에 묻히면 안 된다.
        expr: |
          sum (rate(http_server_requests_seconds_count{uri=~"/api/(brokerage|matching)/orders", status=~"5.."}[2m]))
          /
          sum (rate(http_server_requests_seconds_count{uri=~"/api/(brokerage|matching)/orders"}[2m]))
          > 0.05
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "주문 경로 5xx 5% 초과"
          description: "주문 접수 엔드포인트의 5xx 비율이 {{ $value | humanizePercentage }}입니다. 실거래 주문이 실패하고 있을 수 있습니다."

      - alert: BrokerCircuitOpen
        # KIS/Toss 브레이커가 열리면 실주문이 전부 즉시 실패 처리된다.
        expr: |
          resilience4j_circuitbreaker_state{name=~"kis|toss", state="open"} == 1
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "브로커 서킷브레이커 {{ $labels.name }} OPEN"
          description: "{{ $labels.name }} 증권사 API 호출이 차단 중입니다 — 실주문이 막힌 상태. 증권사 장애인지 우리 쪽 타임아웃인지 확인할 것 (runbook: broker-cb-open)."

      - alert: TickPipelineStalled
        # 장중인데 틱이 흐르지 않는다. 시간대 조건은 KST 09:00~15:30 (UTC 00:00~06:30) 평일.
        # topic 라벨은 Kafka 클라이언트가 '.'을 '_'로 바꿔 노출한다(market.ticks → market_ticks). "market.ticks"로 쓰면
        # 영원히 매칭되지 않는다 — 실제로 그랬다(2026-09-14 check-metrics.py로 발견).
        expr: |
          (
            sum(rate(tick_latency_total_pipeline_seconds_count[3m])) == 0
            or
            max(kafka_consumer_fetch_manager_records_lag_max{topic="market_ticks"}) > 60000
          )
          and on() (hour() >= 0 and hour() < 7 and day_of_week() >= 1 and day_of_week() <= 5)
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "장중 틱 파이프라인 정지"
          description: "장중인데 3분간 처리된 틱이 0이거나 market.ticks 컨슈머 랙이 60,000건을 넘었습니다. 사용자에게 시세가 멈춰 보입니다 (runbook: tick-stalled)."

      - alert: LedgerMismatch
        # ADR-043 대사 배치가 올리는 카운터. 잔고 정합성 에러버짓은 0 — 하나라도 나면 조사한다.
        # 자동 교정 금지 (runbook: ledger-mismatch). mode="report"(최초 실행·정리 기간)는 페이지하지 않는다 — LedgerMismatchReported.
        expr: increase(ledger_reconciliation_mismatch_total{mode="alert"}[1h]) > 0
        labels: { severity: critical }
        annotations:
          summary: "원장-잔고 불일치 감지"
          description: "지난 1시간 대사에서 {{ $value }}건의 (잔고+예약금) vs (초기+원장 합) 불일치가 발생했습니다. 자동 교정하지 말고 조사할 것."

      - alert: LedgerMismatchReported
        # report 모드로 돌고 있는 동안의 불일치 — 페이지는 아니지만 티켓은 만든다. alert로 전환하려면 이게 0이어야 한다.
        expr: increase(ledger_reconciliation_mismatch_total{mode="report"}[24h]) > 0
        labels: { severity: ticket }
        annotations:
          summary: "원장 대사 리포트 모드에서 불일치 {{ $value }}건"
          description: "LEDGER_RECON_MODE=report 상태. ledger_snapshots WHERE mismatch 로 유저·날짜를 찾아 조사하고, 0이 되면 alert 모드로 전환."

      - alert: LedgerReconciliationDidNotRun
        # 배치가 안 돌면 불일치도 안 보인다 — 침묵을 알람으로. 평일 17:30 KST 실행, 26시간 동안 checked 증가 0이면 이상.
        expr: increase(ledger_reconciliation_checked_total[26h]) == 0 and on() (day_of_week() > 0 and day_of_week() < 6)
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "원장 대사 배치가 26시간 동안 돌지 않음"
          description: "ledgerReconciliationJob이 실행되지 않았거나 대상 유저가 0명입니다. BatchJobScheduler 로그와 batch_job_execution을 확인할 것."

      - alert: IdempotencyStoreDown
        # 멱등성은 fail-closed(ADR/P0-1)라 Redis가 죽으면 주문이 503으로 거절된다. 사용자가 즉시 아프다.
        expr: increase(redis_command_failed_total{op=~"idempotency_.*"}[2m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "멱등성 저장소(Redis) 실패 — 주문 거절 중"
          description: "IdempotencyFilter가 Redis에 접근하지 못해 주문·결제 요청을 503으로 거절하고 있습니다 (runbook: redis-down)."

  # ───────────────────────────── Ticket ─────────────────────────────
  - name: monticker-ticket
    rules:
      - alert: RedisFailOpenSustained
        # 레이트리밋·캐시가 fail-open으로 5분 넘게 돌고 있다 — 남용 방어가 꺼진 채 운영 중.
        expr: sum by (op) (increase(redis_command_failed_total{policy="open"}[5m])) > 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Redis fail-open 지속 (op={{ $labels.op }})"
          description: "5분간 {{ $value }}회 Redis 실패로 fail-open이 발동했습니다. 서비스는 살아있지만 레이트리밋/캐시 없이 돌고 있습니다."

      - alert: HikariPoolNearExhaustion
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }} DB 커넥션 풀 90% 이상"
          description: "느린 쿼리나 커넥션 누수를 의심할 것. statement_timeout이 발동하고 있는지 로그 확인."

      - alert: HikariPendingThreads
        expr: hikaricp_connections_pending > 5
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }} 커넥션 대기 스레드 {{ $value }}개"
          description: "요청이 DB 커넥션을 기다리고 있습니다. 풀 고갈 직전 신호."

      - alert: HighJvmHeapUsage
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"})
          /
          sum by (application) (jvm_memory_max_bytes{area="heap"} > 0)
          > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }} 힙 85% 초과"
          description: "10분 이상 힙 사용률 85% 초과. GC 압박 또는 누수 가능성. 알림 룰 인덱스(ADR-044)나 캔들 상태가 커지고 있는지 확인."

      - alert: NonBrokerCircuitOpen
        # 브로커 외 CB(yahoo, naver, dart, expo, MSA 프록시)는 폴백이 있어 사용자가 즉시 아프지는 않다.
        expr: resilience4j_circuitbreaker_state{name!~"kis|toss", state="open"} == 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "서킷브레이커 {{ $labels.name }} OPEN 5분 지속"
          description: "{{ $labels.name }}이 폴백으로 동작 중입니다. 외부 API 상태를 확인할 것."

      - alert: DltMessagesGrowing
        expr: sum by (topic) (increase(dlt_messages_total[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "DLT 유입: {{ $labels.topic }}"
          description: "지난 15분간 {{ $value }}건이 재시도 후 DLT로 갔습니다. 수동 재처리 대상 — 원인을 보고 재발행할 것."

      - alert: OutboxBacklog
        expr: outbox_pending > 100 or outbox_oldest_age_seconds > 600   # 게이지엔 _total이 붙지 않는다 (BacklogGauges 주석)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Outbox 적체"
          description: "event_publication에 미완료 이벤트 {{ $value }}건 또는 10분 이상 된 이벤트가 있습니다. Kafka 발행이 막혀 있을 수 있습니다."

      - alert: SagaIncomplete
        expr: saga_incomplete > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "미완료 Saga {{ $value }}건 15분 잔류"
          description: "order_sagas에 STARTED/COMPENSATING 상태가 15분 이상 남아 있습니다. 자동 복구(5분 주기)가 실패 중 — 수동 검토."

      - alert: SearchIndexMappingMismatch
        # ADR-042 — 기동 시 SearchIndexManager가 설계 매핑과 실제를 대조한다. 1이면 검색이 설계대로 동작하지 않는다
        # (날짜 정렬 실패, nori 미적용 …). 자동 수정 없음 — POST /api/admin/search/reindex/{index}.
        expr: max by (index) (search_index_mapping_mismatch) > 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "ES 인덱스 {{ $labels.index }} 매핑이 설계와 다름"
          description: "SearchIndexManager 로그의 차이 목록을 보고 재색인할 것. 동적 매핑으로 생성된 인덱스의 흔적이다."

      - alert: SearchIndexDltGrowing
        # search.index 배치가 4회 재시도 후에도 실패 — ES가 오래 죽었거나 문서가 매핑을 위반한다.
        expr: increase(dlt_messages_total{topic="search.index"}[10m]) > 0
        labels: { severity: ticket }
        annotations:
          summary: "검색 색인 DLT {{ $value }}건"
          description: "search.index-dlt를 확인하고 원인 해결 후 컨슈머 그룹 오프셋 되감기(ADR-042 §5)로 재처리."

      - alert: SearchFallbackSustained
        # ES가 죽은 채 몇 주가 지나도 모르는 상황을 막는다 (resilience-plan §A6).
        expr: sum by (index) (increase(search_fallback_total[10m])) > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "검색 폴백 지속 (index={{ $labels.index }})"
          description: "ES 검색이 10분 이상 DB 폴백으로 동작 중입니다. 사용자는 검색 품질 저하만 겪지만 ES 상태를 확인할 것."

      - alert: CandleFlushFailing
        expr: increase(candle_flush_failed_total[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "캔들 저장 실패"
          description: "지난 10분간 {{ $value }}건의 candles_1m/1d upsert가 실패했습니다. 압축 chunk 충돌(ADR-041)이나 DB 문제. 조용히 캔들이 비어가는 중."

      - alert: AlertRuleEvalFailing
        # VOLUME_SURGE가 무효 SQL로 한 번도 발동한 적 없었던 사고의 재발 방지 (ADR-044).
        expr: sum by (ruleType) (increase(alert_rule_eval_failed_total[10m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "알림 룰 평가 실패 (ruleType={{ $labels.ruleType }})"
          description: "지난 10분간 {{ $value }}건 평가 실패. 이 룰 타입의 알림이 조용히 발동하지 않고 있습니다."

      - alert: BacktestQueueSaturated
        expr: executor_queued_tasks{name="backtestExecutor"} >= 20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "백테스트 큐 포화"
          description: "bulkhead 큐(20)가 5분 이상 가득 찼습니다. 신규 요청은 429로 거절 중. 백테스트 워커 풀(backtestExecutor) 상향 또는 분석 경로 모듈 추출(ADR-049 Revisit) 검토."

      - alert: WsConnectionsSkewed
        # 한 pod에 연결이 몰리면 그 pod의 fan-out 비용이 편중된다 (ADR-038).
        expr: |
          max(ws_active_connections) > 2 * (avg(ws_active_connections) + 50)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "WebSocket 연결 pod 편중"
          description: "최대 {{ $value }} 연결인 pod가 평균의 2배를 넘습니다. LB 세션 고정이나 재연결 폭주를 확인."

      - alert: ExternalHttpSlow
        # 타임아웃(P0-2) 전에 "느리다"를 먼저 본다. slowCallDurationThreshold를 넘긴 호출 비율(%).
        # resilience4j가 슬라이딩 윈도우 기준으로 계산해 게이지로 노출한다(-1 = 표본 부족).
        expr: resilience4j_circuitbreaker_slow_call_rate > 20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "외부 호출 느림: {{ $labels.name }}"
          description: "{{ $labels.name }} 호출의 {{ $value }}%가 slow-call 임계를 넘었습니다. 브레이커가 열리기 전 단계."
