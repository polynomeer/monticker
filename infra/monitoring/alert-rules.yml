groups:
  - name: monticker-availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"monticker-.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} 다운"
          description: "{{ $labels.job }}({{ $labels.instance }})이 1분 이상 스크레이프에 응답하지 않습니다."

      - alert: HighHttpErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum by (application) (rate(http_server_requests_seconds_count[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }} 5xx 비율 5% 초과"
          description: "지난 5분간 {{ $labels.application }}의 5xx 응답 비율이 5%를 넘었습니다. 실거래(브로커 주문) 경로일 경우 즉시 확인 필요."

  - name: monticker-resilience
    rules:
      # KIS/Toss 등 브로커 API 서킷브레이커가 OPEN이면 실주문이 전부 REJECTED로 폴백 중이라는 뜻이다.
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "서킷브레이커 {{ $labels.name }} OPEN"
          description: "{{ $labels.name }} 서킷브레이커가 열렸습니다 — 해당 외부 API 호출이 즉시 실패 처리되고 있습니다(브로커라면 실주문이 막힌 상태)."

  - name: monticker-resources
    rules:
      - alert: HighJvmHeapUsage
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"})
          /
          sum by (application) (jvm_memory_max_bytes{area="heap"} > 0)
          > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} 힙 사용률 85% 초과"
          description: "10분 이상 힙 사용률이 85%를 넘었습니다. GC 압박 또는 메모리 누수 가능성."

      - alert: HikariPoolNearExhaustion
        expr: |
          hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }} DB 커넥션 풀 90% 이상 사용 중"
          description: "커넥션 풀이 고갈에 가까워지고 있습니다 — 느린 쿼리나 커넥션 누수를 의심할 것."
