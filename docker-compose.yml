services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: monticker-postgres
    environment:
      POSTGRES_DB: monticker
      POSTGRES_USER: monticker
      POSTGRES_PASSWORD: monticker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monticker"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monticker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: monticker-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/monticker
      DB_USER: monticker
      DB_PASSWORD: monticker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Pinpoint agent 활성화 (--profile pinpoint 와 함께 사용)
      PINPOINT_ENABLE: ${PINPOINT_ENABLE:-false}
      PINPOINT_COLLECTOR_IP: pinpoint-collector
      PINPOINT_AGENT_ID: ${PINPOINT_API_AGENT_ID:-monticker-api-1}
      PINPOINT_APP_NAME: monticker-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

  worker:
    build:
      context: ./backend/worker
      dockerfile: Dockerfile
    container_name: monticker-worker
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/monticker
      DB_USER: monticker
      DB_PASSWORD: monticker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      DART_API_KEY: ${DART_API_KEY:-}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      INGESTION_SOURCE: ${INGESTION_SOURCE:-internal}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PINPOINT_ENABLE: ${PINPOINT_ENABLE:-false}
      PINPOINT_COLLECTOR_IP: pinpoint-collector
      PINPOINT_AGENT_ID: ${PINPOINT_WORKER_AGENT_ID:-monticker-worker-1}
      PINPOINT_APP_NAME: monticker-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

  # ── Kafka realtime pipeline (optional, see ADR-005) ──────────
  # Bring up with: docker compose --profile kafka up
  # MSA 모드에서도 필수 — docker compose --profile msa up 으로 함께 기동됨
  kafka:
    image: apache/kafka:3.8.0
    container_name: monticker-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 컨테이너 내부망(kafka:9092)과 호스트(localhost:29092) 양쪽에서 접근 가능하도록 리스너 분리
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "monticker-kafka-cluster-001"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles:
      - kafka
      - msa

  market-gateway:
    build:
      context: ./services/market-gateway
      dockerfile: Dockerfile
    container_name: monticker-market-gateway
    environment:
      KAFKA_BROKERS: kafka:9092
      DB_URL: postgres://monticker:monticker@postgres:5432/monticker?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles:
      - kafka

  broadcast-gateway:
    build:
      context: ./services/broadcast-gateway
      dockerfile: Dockerfile
    container_name: monticker-broadcast-gateway
    ports:
      - "9090:9090"
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - kafka

  # ── MSA Worker 분리 (WORKER_ROLE별 독립 컨테이너) ─────────────
  # 기동: docker compose --profile msa up
  # worker(단일 프로세스, role=all)와 동시에 올리지 않는다.
  worker-market:
    build:
      context: ./backend/worker
      dockerfile: Dockerfile
    container_name: monticker-worker-market
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/monticker
      DB_USER: monticker
      DB_PASSWORD: monticker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      WORKER_ROLE: market
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles:
      - msa

  worker-event:
    build:
      context: ./backend/worker
      dockerfile: Dockerfile
    container_name: monticker-worker-event
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/monticker
      DB_USER: monticker
      DB_PASSWORD: monticker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      WORKER_ROLE: event
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles:
      - msa

  worker-alert:
    build:
      context: ./backend/worker
      dockerfile: Dockerfile
    container_name: monticker-worker-alert
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/monticker
      DB_USER: monticker
      DB_PASSWORD: monticker
      KAFKA_BROKERS: kafka:9092
      WORKER_ROLE: alert
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles:
      - msa

  # ── Observability ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: monticker-prometheus
    ports:
      - "9091:9090"   # 9090은 broadcast-gateway와 충돌 — 호스트 포트만 변경
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.2
    container_name: monticker-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: monticker
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-overview.json
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: monticker-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP (api/worker → jaeger)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: monticker-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles:
      - full

  # ── Pinpoint APM (optional) ───────────────────────────────────
  # Bring up with: docker compose --profile pinpoint up
  # UI: http://localhost:18080  (초기 기동 2~3분 소요 — HBase 스키마 초기화)
  #
  # 에이전트 활성화 방법 (api / worker 서비스에 환경변수 추가):
  #   PINPOINT_ENABLE: "true"
  #   PINPOINT_COLLECTOR_IP: pinpoint-collector
  #   PINPOINT_AGENT_ID: monticker-api-1     (인스턴스마다 고유값)
  #   PINPOINT_APP_NAME: monticker-api
  pinpoint-hbase:
    image: pinpointdocker/pinpoint-hbase:2.5.4
    container_name: monticker-pinpoint-hbase
    environment:
      HBASE_MASTER_PORT: 16000
      HBASE_MASTER_INFO_PORT: 16010
      HBASE_REGIONSERVER_PORT: 16020
      HBASE_REGIONSERVER_INFO_PORT: 16030
    volumes:
      - pinpoint_hbase_data:/home/pinpoint/hbase
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | hbase zkcli -server localhost:2181 2>/dev/null | grep -q imok"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    profiles:
      - pinpoint

  pinpoint-collector:
    image: pinpointdocker/pinpoint-collector:3.1.0
    container_name: monticker-pinpoint-collector
    ports:
      - "9991:9991"   # gRPC agent channel
      - "9992:9992"   # gRPC stat channel
      - "9993:9993"   # gRPC span channel
    environment:
      SPRING_PROFILES_ACTIVE: release
      PINPOINT_ZOOKEEPER_ADDRESS: pinpoint-hbase
      COLLECTOR_RECEIVER_GRPC_AGENT_PORT: 9991
      COLLECTOR_RECEIVER_GRPC_STAT_PORT: 9992
      COLLECTOR_RECEIVER_GRPC_SPAN_PORT: 9993
    depends_on:
      pinpoint-hbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9990/actuator/health 2>/dev/null | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    profiles:
      - pinpoint

  pinpoint-web:
    image: pinpointdocker/pinpoint-web:3.1.0
    container_name: monticker-pinpoint-web
    ports:
      - "18080:8080"   # Pinpoint UI (8080은 api 서비스와 충돌 — 호스트 포트 변경)
    environment:
      SPRING_PROFILES_ACTIVE: release
      PINPOINT_ZOOKEEPER_ADDRESS: pinpoint-hbase
      CLUSTER_ENABLE: "true"
    depends_on:
      pinpoint-hbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health 2>/dev/null | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    profiles:
      - pinpoint

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  pinpoint_hbase_data:
