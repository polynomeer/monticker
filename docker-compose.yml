services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: monticker-postgres
    environment:
      POSTGRES_DB: monticker
      POSTGRES_USER: monticker
      POSTGRES_PASSWORD: monticker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monticker"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monticker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: monticker-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/monticker
      DB_USER: monticker
      DB_PASSWORD: monticker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

  worker:
    build:
      context: ./backend/worker
      dockerfile: Dockerfile
    container_name: monticker-worker
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/monticker
      DB_USER: monticker
      DB_PASSWORD: monticker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      DART_API_KEY: ${DART_API_KEY:-}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      INGESTION_SOURCE: ${INGESTION_SOURCE:-internal}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

  # ── Kafka realtime pipeline (optional, see ADR-005) ──────────
  # Bring up with: docker compose --profile kafka up
  kafka:
    image: apache/kafka:3.8.0
    container_name: monticker-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 컨테이너 내부망(kafka:9092)과 호스트(localhost:29092) 양쪽에서 접근 가능하도록 리스너 분리
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "monticker-kafka-cluster-001"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles:
      - kafka

  market-gateway:
    build:
      context: ./services/market-gateway
      dockerfile: Dockerfile
    container_name: monticker-market-gateway
    environment:
      KAFKA_BROKERS: kafka:9092
      DB_URL: postgres://monticker:monticker@postgres:5432/monticker?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles:
      - kafka

  broadcast-gateway:
    build:
      context: ./services/broadcast-gateway
      dockerfile: Dockerfile
    container_name: monticker-broadcast-gateway
    ports:
      - "9090:9090"
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - kafka

  # ── Observability ─────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: monticker-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP (api/worker → jaeger)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: monticker-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
