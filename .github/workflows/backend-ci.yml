name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [api, worker, trading-service, quant-engine]

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: monticker_test
          POSTGRES_USER: monticker
          POSTGRES_PASSWORD: monticker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Unit tests — ${{ matrix.module }}
        run: cd backend/${{ matrix.module }} && ./gradlew test

      # 실제 Postgres/Redis 컨테이너(Testcontainers)로 목킹 없이 검증한다.
      # GitHub-hosted 러너는 Docker가 기본 설치돼 있어 별도 설정이 필요 없다.
      - name: Integration tests — ${{ matrix.module }}
        run: cd backend/${{ matrix.module }} && ./gradlew integrationTest
