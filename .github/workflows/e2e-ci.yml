name: e2e-ci

# 실제 API(backend/api) + Web(apps/web)을 함께 띄우고 브라우저로 구동하는
# 통합(e2e) 테스트. backend-ci/web-ci는 각 앱을 격리해서 검증하기 때문에,
# CSP 헤더나 API↔Web 실제 연결처럼 두 앱이 "실제로 붙어야" 드러나는 회귀는
# 여기서만 잡힌다 (예: connect-src 누락으로 SockJS가 막히는 문제).
on:
  pull_request:
    paths:
      - "backend/api/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/e2e-ci.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: monticker
          POSTGRES_USER: monticker
          POSTGRES_PASSWORD: monticker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @monticker/web exec playwright install --with-deps chromium

      # DB_URL/REDIS_HOST 등은 application.yml 기본값이 위 services 컨테이너와
      # 이미 일치한다(localhost:5432/monticker, localhost:6379). OAuth2/DART/Naver
      # 같은 외부 연동 키는 전부 선택값이라 비워둬도 부팅에 영향 없다.
      - name: Start API in background
        working-directory: backend/api
        run: |
          nohup ./gradlew bootRun --console=plain -q > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "Started ApiApplication" /tmp/api.log 2>/dev/null; then
              echo "API ready"; exit 0
            fi
            if grep -qiE "BUILD FAILED|APPLICATION FAILED TO START" /tmp/api.log 2>/dev/null; then
              echo "API failed to start"; tail -300 /tmp/api.log; exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for API"; tail -300 /tmp/api.log; exit 1

      - name: Build & start Web in background
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: |
          pnpm build
          nohup pnpm start > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null 2>&1 && { echo "Web ready"; exit 0; }
            sleep 2
          done
          echo "Timed out waiting for Web"; cat /tmp/web.log; exit 1

      - name: Run e2e tests
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Dump API/Web logs on failure
        if: failure()
        run: |
          echo "── api.log (tail) ──"; tail -200 /tmp/api.log || true
          echo "── web.log (tail) ──"; tail -200 /tmp/web.log || true
