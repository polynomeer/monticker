name: web-ci

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/web-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 버전은 package.json의 packageManager(pnpm@9.15.9)에서 읽는다 — 여기에 version을 같이
      # 적으면 action-setup@v4가 "Multiple versions of pnpm specified"로 실패한다.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+ severity, apps/web + packages scope)
        run: node scripts/ci/audit-scope.js apps/web packages/

      - name: Lint
        run: pnpm --filter @monticker/web lint

      - name: Test
        run: pnpm --filter @monticker/web test

      - name: Build
        run: pnpm --filter @monticker/web build
