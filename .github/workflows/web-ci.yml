name: web-ci

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/web-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # 버전은 package.json의 packageManager(pnpm@9.15.9)에서 읽는다 — 여기에 version을 같이
      # 적으면 action-setup@v4가 "Multiple versions of pnpm specified"로 실패한다.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # braces(GHSA-vfj7-8cjw-p6xm, 2026-09-18): 취약 범위가 <=3.0.3이고 patched_versions가 "<0.0.0"(업스트림
      # 패치 없음)라 override로 해결 불가. 경로가 eslint-config-next > fast-glob > micromatch 뿐인 린트 도구 전용이고,
      # 우리가 작성한 glob 패턴만 처리해 실질 위험이 낮아 예외 처리. 패치가 나오면 --allow를 지울 것.
      - name: Audit dependencies (high+ severity, apps/web + packages scope)
        run: node scripts/ci/audit-scope.js apps/web packages/ --allow braces

      - name: Lint
        run: pnpm --filter @monticker/web lint

      - name: Test
        run: pnpm --filter @monticker/web test

      - name: Build
        run: pnpm --filter @monticker/web build
