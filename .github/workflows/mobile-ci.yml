name: mobile-ci

on:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-ci.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      # 버전은 package.json의 packageManager(pnpm@9.15.9)에서 읽는다 — 여기에 version을 같이 적으면
      # action-setup이 "Multiple versions of pnpm specified"로 실패한다(web-ci와 같은 이유).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Expo SDK는 RN·React·expo-* 버전을 한 세트로 고정한다. 워크스페이스가 lockfile 하나라 dependabot의 react 그룹이
      # 웹과 함께 모바일 React를 SDK 밖 버전으로 올릴 수 있다 — 설치된 버전이 SDK와 다르면 여기서 실패한다.
      # EXPO_OFFLINE: 온라인이면 Expo 서버의 "그 SDK 최신 패치"와 비교해 Expo가 패치(57.0.29 → 57.0.30)를 낼 때마다
      # 아무것도 안 바꾼 PR까지 실패했다(2026-10-14). 오프라인은 설치된 expo의 bundledNativeModules 기준이라
      # SDK가 허용하는 범위를 벗어난 버전(예: react 19.3 on SDK 57)만 잡는다.
      - name: Expo SDK version check
        env:
          CI: "1"
          EXPO_OFFLINE: "1"
        run: pnpm exec expo install --check

      - name: Audit dependencies (high+ severity, apps/mobile scope)
        working-directory: .
        # braces·node-forge는 업스트림 패치가 없어 override로 해결할 수 없다(patched_versions "<0.0.0"). Expo SDK 57 기준
        # braces는 @expo/cli > metro > metro-file-map > micromatch, node-forge는 @expo/cli > @expo/code-signing-certificates
        # — 둘 다 앱 번들에 들어가지 않는 개발 도구(CLI·번들러) 경로다. web-ci 주석 참고. 패치가 나오면 --allow를 지울 것.
        # (image-size 예외는 SDK 57로 올리며 경로가 사라져 지웠다.)
        # zod(GHSA-mrhx-c7xc-m3w5)는 4.6.6에서만 고쳐졌다. @expo/cli가 zod 3을 쓰므로 4로 강제하면 CLI가 깨질 수 있고, 이 역시
        # 앱 번들에 들어가지 않는 개발 도구(CLI) 경로다. Expo가 zod 4로 옮기면 --allow zod를 지울 것.
        run: node scripts/ci/audit-scope.js apps/mobile --allow braces --allow node-forge --allow zod

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      # 순수 로직(색 해석·숫자 표시 등) — Node 24는 타입 표기를 그대로 지워 실행한다
      - name: Unit tests
        run: pnpm test
