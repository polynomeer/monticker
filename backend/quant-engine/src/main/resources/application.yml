spring:
  application:
    name: monticker-quant-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monticker}
    username: ${DB_USER:monticker}
    password: ${DB_PASSWORD:monticker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      # resilience-plan §A4 / P1-3 — 느린 쿼리가 커넥션을 무한정 잡고 풀을 고갈시키는 것을 막는다.
      # 물리 커넥션마다 1회 실행된다. 120s: 백테스트·최적화는 수십 초가 정상 범위.
      connection-init-sql: "SET statement_timeout = '120s'"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: ${MONGODB_URI:mongodb://monticker:monticker@localhost:27017/monticker?authSource=admin}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # resilience-plan §A3 / P0-6 — readiness가 실제 서빙 가능 여부를 본다.
      # 설정이 없으면 Spring 기본값(readinessState만)이라 DB가 죽어도 pod는 Ready로 남아
      # 트래픽을 계속 받는다. db는 readiness에만 넣는다 — liveness에 넣으면 DB 장애가
      # pod 재시작 루프를 유발해 복구가 더 느려진다. liveness는 프로세스 생존만 본다.
      probes:
        enabled: true        # K8s 밖(docker-compose)에서도 /readiness, /liveness 노출
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: monticker-quant-engine
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

quant:
  # true: api가 Modulith 외부화로 발행하는 trading.order-filled 구독 (ADR-048: trading-service 폐기)
  # false: Spring Event 방식 (단일 프로세스 api 내 동작, 기본값)
  trading-events:
    enabled: ${QUANT_TRADING_EVENTS_ENABLED:false}
