spring:
  application:
    name: monticker-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monticker}
    username: ${DB_USER:monticker}
    password: ${DB_PASSWORD:monticker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      # resilience-plan §A4 / P1-3 — 느린 쿼리가 커넥션을 무한정 잡고 풀을 고갈시키는 것을 막는다.
      # 물리 커넥션마다 1회 실행된다. 60s: 캔들 백필·수집 배치는 길 수 있으나 무제한은 아니다.
      connection-init-sql: "SET statement_timeout = '60s'"
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false
  # ADR-042 — worker는 더 이상 ES에 쓰지 않는다. 색인은 SearchIndexEvent → Kafka search.index → api 컨슈머.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  kafka:
    listener:
      # ADR-040 파티션 수까지 병렬 소비. 로컬 12 파티션 기준 4. 운영은 파티션 수에 맞춰 ConfigMap으로.
      # L-03: 단일 스레드 ~2,000 tick/s → 스레드 수만큼 선형에 가깝게 늘어난다(같은 종목은 같은 스레드).
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:4}
    # TickKafkaConsumer(@KafkaListener)는 ingestion.source=kafka가 아닌 한(기본값
    # internal) Spring Boot 자동구성 ConsumerFactory를 쓴다 — 이 값이 없으면 KAFKA_BROKERS를
    # 무시하고 Spring Boot 기본값(localhost:9092)에 그대로 접속한다. 아래 kafka.brokers(비
    # spring 네임스페이스)는 TickKafkaProducer/조건부 KafkaConfig에서만 읽는 별도 키라
    # 이것만으로는 커버되지 않는다 — 실제로 이 둘이 어긋나 있던 걸 라이브 테스트로 발견했다.
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    # producer 직렬화기는 기본(String)을 유지한다 — @RetryableTopic의 재시도/DLT 발행이 기본 KafkaTemplate으로
    # String 레코드를 전달한다. Modulith 외부화(byte[] JSON)는 SearchOutboxKafkaConfig의 별도 템플릿을 쓴다.
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        size: 4

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # resilience-plan §A3 / P0-6 — readiness가 실제 서빙 가능 여부를 본다.
      # 설정이 없으면 Spring 기본값(readinessState만)이라 DB가 죽어도 pod는 Ready로 남아
      # 트래픽을 계속 받는다. db는 readiness에만 넣는다 — liveness에 넣으면 DB 장애가
      # pod 재시작 루프를 유발해 복구가 더 느려진다. liveness는 프로세스 생존만 본다.
      probes:
        enabled: true        # K8s 밖(docker-compose)에서도 /readiness, /liveness 노출
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: monticker-worker
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

naver:
  news:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

dart:
  api-key: ${DART_API_KEY:}

kis:
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}

toss:
  # ADR-031 — 플랫폼 전체 시세용 앱 레벨 키. TOSS_APP_KEY/TOSS_APP_SECRET(BYOK 브로커리지
  # 연동 전용, backend/api TossBrokerageClient)와 이름을 절대 공유하지 않는다 — 같은 이름을
  # 쓰면 "BYOK 전용, .env에 넣지 않음"이라는 기존 관례와 충돌해 혼동을 일으킨다.
  platform:
    app-key: ${TOSS_PLATFORM_APP_KEY:}
    app-secret: ${TOSS_PLATFORM_APP_SECRET:}
    base-url: ${TOSS_PLATFORM_BASE_URL:https://openapi.tossinvest.com}
  ws-url: ${TOSS_WS_URL:wss://openapi-ws.tossinvest.com/ws/v1}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

otel:
  service:
    name: monticker-worker

# 시세 수집 소스 (Stage 4: 모든 경로가 Kafka를 경유한다)
# internal(기본값) = MockPriceGenerator                        → Kafka market.ticks
# kafka            = Go market-gateway                         → Kafka market.ticks
# kis              = KIS 실시간체결가(국내 21종목, ADR-030)      → Kafka market.ticks
# toss             = Toss 실시간체결가(미국 전체+국내 나머지, ADR-031) → Kafka market.ticks
# ADR-031부터 콤마로 여러 개를 동시에 켤 수 있다 — 예: "kis,toss". kafka는 Go가 발행을
# 전담하므로 다른 값과 병행하지 않는다(정확히 "kafka" 하나일 때만 내부 스케줄러가 꺼진다).
ingestion:
  source: ${INGESTION_SOURCE:internal}

kafka:
  brokers: ${KAFKA_BROKERS:localhost:9092}

worker:
  # 역할: all(단일 프로세스, 기본값) | market | event | alert
  role: ${WORKER_ROLE:all}
