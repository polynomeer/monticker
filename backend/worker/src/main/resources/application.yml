spring:
  application:
    name: monticker-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monticker}
    username: ${DB_USER:monticker}
    password: ${DB_PASSWORD:monticker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8081
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: monticker-worker
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

scheduling:
  pool:
    size: 4

naver:
  news:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

dart:
  api-key: ${DART_API_KEY:}

kis:
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

otel:
  service:
    name: monticker-worker

# 시세 수집 소스 (Stage 4: 두 경로 모두 Kafka를 경유한다)
# internal(기본값) = MockPriceGenerator → Kafka market.ticks → TickKafkaConsumer
# kafka            = Go market-gateway  → Kafka market.ticks → TickKafkaConsumer
# 차이: internal 일 때 MarketTickScheduler(Spring)가 틱을 생성·발행.
#       kafka    일 때 MarketTickScheduler를 비활성화하고 Go gateway가 발행.
ingestion:
  source: ${INGESTION_SOURCE:internal}

kafka:
  brokers: ${KAFKA_BROKERS:localhost:9092}

worker:
  # 역할: all(단일 프로세스, 기본값) | market | event | alert
  # MSA 모드에서는 WORKER_ROLE 환경변수로 각 컨테이너에 역할을 지정한다.
  role: ${WORKER_ROLE:all}
