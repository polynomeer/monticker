spring:
  application:
    name: monticker-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monticker}
    username: ${DB_USER:monticker}
    password: ${DB_PASSWORD:monticker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      # resilience-plan §A4 / P1-3 — 느린 쿼리가 커넥션을 무한정 잡고 풀을 고갈시키는 것을 막는다.
      # 물리 커넥션마다 1회 실행된다. 30s: OLTP + 모놀리스 모드의 백테스트/분석 조회. 원장 전체 조회(ADR-043 전) 같은 폭주는 여기서 잘린다.
      connection-init-sql: "SET statement_timeout = '30s'"
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate: {}
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true
  batch:
    jdbc:
      initialize-schema: never   # V17 Flyway 마이그레이션으로 관리
    job:
      enabled: false             # 기동 시 자동 실행 방지 — BatchJobScheduler가 직접 실행
  # Spring Boot 3의 ES 접속 키는 spring.elasticsearch.uris 다. 이전에는 spring.data.elasticsearch.uris
  # (Boot 3에 존재하지 않는 키)에 두어 ELASTICSEARCH_URI가 조용히 무시되고 기본값 localhost:9200을 썼다 —
  # 컨테이너 배포에서는 ES에 한 번도 연결된 적이 없었고 전부 DB 폴백으로 동작했다.
  # CH-04 카오스 실험이 search_fallback_total로 잡아냈다 (resilience-plan §6.3).
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 명시하지 않으면 Lettuce 기본 60초 — Redis가 느려지면 요청이 60초씩 매달려 Tomcat 스레드가
      # 고갈된다(resilience-plan §A2). 시세 조회에 200ms 넘게 걸리면 그건 이미 장애다.
      timeout: 200ms
      connect-timeout: 500ms
    mongodb:
      uri: ${MONGODB_URI:mongodb://monticker:monticker@localhost:27017/monticker?authSource=admin}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # api의 유일한 프로듀서는 Modulith 외부화(@Externalized OrderFilledEvent 등)다. Modulith의
      # KafkaJacksonConfiguration이 ByteArrayJsonMessageConverter를 등록해 페이로드를 byte[] JSON으로 만드므로
      # 값 직렬화기는 ByteArraySerializer여야 한다. StringSerializer였을 때는 "Can't convert value of class [B"로
      # 외부화가 100% 실패했다 — trading.order-filled가 Kafka에 한 번도 도달한 적이 없었다 (CH-05에서 발견).
      # 컨슈머는 UTF-8 JSON 바이트를 String으로 읽으면 된다 (예: SearchIndexConsumer).
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all           # 모든 ISR 확인 후 ACK — 유실 방지
      retries: 3
      properties:
        enable.idempotence: true   # 프로듀서 멱등성 (중복 발행 방지)
        # CH-05 — 브로커가 죽어 있을 때 외부화 리스너 스레드가 send 퓨처를 붙드는 시간의 상한.
        # 기본 delivery.timeout 120s는 스레드를 2분씩 점유한다. 10초 안에 못 보내면 실패로 끝내고
        # event_publication의 미완료 행으로 남긴다 — OutboxResubmissionConfig가 5분 주기로 재전송한다.
        # 짧은 끊김(<10s)은 프로듀서 버퍼가, 긴 장애는 Outbox가 담당한다.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ADR-029 — market.ticks 브로드캐스트 컨슈머(monticker-api-broadcast)는 재시작 시
      # 밀려있던 과거 틱을 한꺼번에 쏟아내지 않도록 항상 최신 틱부터 받는다.
      auto-offset-reset: latest
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      client:
        # client-id/secret이 비어있으면 OAuth2ClientProperties.validate()가 기동 자체를 막는다.
        # 소셜 로그인 키를 설정하지 않은 로컬/dev 환경에서도 뜨도록 더미 값을 기본값으로 둔다 —
        # 실제 로그인 시도는 각 provider가 거부할 뿐, 보안상 문제는 없다. (prod는 application-prod.yml에서 필수값으로 덮어씀)
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID:unset}
            client-secret: ${KAKAO_CLIENT_SECRET:unset}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, account_email
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID:unset}
            client-secret: ${NAVER_CLIENT_SECRET:unset}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name, email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # M-001(a) / D-M1-02 — 기본값 8,192 에서 WS 연결 8,192개를 넘는 클라이언트는 accept 큐에서 실패했다(N=10,000 실험, 3회).
    # WS 세션은 연결당 힙 ~140KB 를 쓰므로(같은 실험) 이 값은 힙(-Xmx)과 같이 정한다. 운영 값은 ConfigMap.
    max-connections: ${TOMCAT_MAX_CONNECTIONS:20000}
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      # resilience-plan §A3 / P0-6 — readiness가 실제 서빙 가능 여부를 본다.
      # 설정이 없으면 Spring 기본값(readinessState만)이라 DB가 죽어도 pod는 Ready로 남아
      # 트래픽을 계속 받는다. db는 readiness에만 넣는다 — liveness에 넣으면 DB 장애가
      # pod 재시작 루프를 유발해 복구가 더 느려진다. liveness는 프로세스 생존만 본다.
      probes:
        enabled: true        # K8s 밖(docker-compose)에서도 /readiness, /liveness 노출
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
      show-details: when-authorized
      show-components: when-authorized
    prometheus:
      access: read-only
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: monticker-api
    distribution:
      # ApiLatencyHigh 알람(alert-rules.yml)이 histogram_quantile로 p95를 계산하려면 버킷이 필요하다.
      # slo 경계는 resilience-plan §4.3의 조회 SLO(p95 200ms, p99 500ms) 기준.
      percentiles-histogram:
        http.server.requests: true
        # 대시보드가 histogram_quantile로 pod 간 합산 p99를 그린다 — 요약(summary) 분위수는 합산이 안 된다
        matching.saga.submit: true
        quant.backtest: true
        search_index_lag_seconds: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

app:
  search:
    # ADR-042 — 기동 시 인덱스가 없으면 @Setting/@Field 매핑으로 만든다(nori). 있으면 매핑을 대조해
    # 어긋나면 search_index_mapping_mismatch 게이지를 올린다 — 자동으로 고치지 않는다(재색인은 관리자 몫).
    manage-indices: ${SEARCH_MANAGE_INDICES:true}
    # 기동 시 DB → ES 전량 동기화. 인덱스가 커지면 기동 자체가 장애라 기본 false — dev/local 프로필만 true.
    reindex-on-startup: ${SEARCH_REINDEX_ON_STARTUP:false}
  wallet:
    # ADR-043 — 일일 원장 대사의 불일치 처리. alert: ERROR + LedgerMismatch 페이지 알람.
    # report: WARN + mode="report" 카운터만 — 최초 실행에서 기존 드리프트를 조사·정리할 때까지 (운영 ConfigMap이 결정).
    reconciliation:
      mode: ${LEDGER_RECON_MODE:alert}
  # ADR-040 — Kafka 토픽 파티션/복제. 로컬 기본값. 운영 값(prod: ticks 64, T2 목표 256)은 K8s ConfigMap.
  # 파티션은 늘리기만 가능하고 늘리면 키→파티션 매핑이 바뀐다 — 장 마감 후, ADR-038 배포 이후에만.
  kafka:
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
    partitions:
      market-ticks: ${KAFKA_PARTITIONS_MARKET_TICKS:12}
      tick-processed: ${KAFKA_PARTITIONS_TICK_PROCESSED:6}
      market-events: ${KAFKA_PARTITIONS_MARKET_EVENTS:3}
      trading: ${KAFKA_PARTITIONS_TRADING:3}
      search-index: ${KAFKA_PARTITIONS_SEARCH_INDEX:3}
      retry: ${KAFKA_PARTITIONS_RETRY:1}
  mail:
    from: ${MAIL_FROM:noreply@monticker.io}
  base-url: ${APP_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,https://*.monticker.io}
  # docs/security-review.md C2 — refresh token 쿠키의 Secure 속성. 로컬은 http라 false가
  # 기본값이고, 프로덕션은 반드시 https라 application-prod.yml에서 true로 강제한다.
  cookie-secure: ${COOKIE_SECURE:false}
  social:
    mock:
      enabled: ${SOCIAL_MOCK_ENABLED:false}  # 로컬 개발 전용 — 프로덕션은 반드시 false
  pg:
    mock:
      enabled: ${PG_MOCK_ENABLED:true}        # 로컬 개발 전용 — 프로덕션은 반드시 false
    toss:
      secret-key: ${TOSS_SECRET_KEY:}         # 프로덕션 필수 — 로컬에서는 mock 사용
  brokerage:
    mock:
      enabled: ${BROKERAGE_MOCK_ENABLED:true} # 로컬 개발 전용 — 프로덕션은 반드시 false
    kis:
      base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443} # 기본값: 모의투자 서버
    toss:
      base-url: ${TOSS_BASE_URL:https://openapi.tossinvest.com} # 모의투자 서버 없음 — 항상 실서버
  security:
    # BrokerageAccount.accessToken 등 민감 컬럼 암호화 키 (AES-256, Base64 32바이트).
    # 아래 값은 로컬 개발 전용 — 프로덕션은 반드시 별도 발급한 키로 오버라이드(application-prod.yml 참고).
    # 이 리터럴 값은 git에 커밋된 적이 있어 공개돼 있다 — InsecureSecretGuard가 이 값 그대로
    # 배포되는 걸 막는다 (docs/security-review.md C1). 순수 로컬 개발이면 아래 allow-insecure-dev-secrets 참고.
    credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY:HSKZ1kiMBZ80UfTmpyhmFXh6TtteeeweRhbngzaD4yk=}
    # true면 InsecureSecretGuard가 위 기본값/jwt.secret 기본값을 그대로 써도 기동을 막지 않는다.
    # 로컬 개발 전용 스위치 — 프로덕션에서 절대 true로 설정하지 말 것 (application-prod.yml 참고).
    allow-insecure-dev-secrets: ${ALLOW_INSECURE_DEV_SECRETS:false}


jwt:
  # 이 리터럴 값도 credential-encryption-key와 마찬가지로 git에 커밋된 적이 있어 공개돼 있다 —
  # InsecureSecretGuard가 이 값 그대로 배포되는 걸 막는다 (docs/security-review.md C1).
  secret: ${JWT_SECRET:monticker-dev-secret-key-must-be-at-least-32-bytes-long}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

otel:
  service:
    name: monticker-api

# ── Order Book Provider ───────────────────────────────────────────────────────
orderbook:
  provider: ${ORDERBOOK_PROVIDER:}


