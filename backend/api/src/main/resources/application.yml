spring:
  application:
    name: monticker-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monticker}
    username: ${DB_USER:monticker}
    password: ${DB_PASSWORD:monticker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate: {}
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true
  batch:
    jdbc:
      initialize-schema: never   # V17 Flyway 마이그레이션으로 관리
    job:
      enabled: false             # 기동 시 자동 실행 방지 — BatchJobScheduler가 직접 실행
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: ${MONGODB_URI:mongodb://monticker:monticker@localhost:27017/monticker?authSource=admin}
    elasticsearch:
      uris: ${ELASTICSEARCH_URI:http://localhost:9200}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all           # 모든 ISR 확인 후 ACK — 유실 방지
      retries: 3
      properties:
        enable.idempotence: true   # 프로듀서 멱등성 (중복 발행 방지)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, account_email
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID:}
            client-secret: ${NAVER_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name, email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: 8080
  shutdown: graceful
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    prometheus:
      access: read-only
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: monticker-api
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

app:
  mail:
    from: ${MAIL_FROM:noreply@monticker.io}
  base-url: ${APP_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,https://*.monticker.io}
  social:
    mock:
      enabled: ${SOCIAL_MOCK_ENABLED:false}  # 로컬 개발 전용 — 프로덕션은 반드시 false
  pg:
    mock:
      enabled: ${PG_MOCK_ENABLED:true}        # 로컬 개발 전용 — 프로덕션은 반드시 false
    toss:
      secret-key: ${TOSS_SECRET_KEY:}         # 프로덕션 필수 — 로컬에서는 mock 사용
  brokerage:
    mock:
      enabled: ${BROKERAGE_MOCK_ENABLED:true} # 로컬 개발 전용 — 프로덕션은 반드시 false
    kis:
      base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443} # 기본값: 모의투자 서버


jwt:
  secret: monticker-dev-secret-key-must-be-at-least-32-bytes-long
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

otel:
  service:
    name: monticker-api

# ── Order Book Provider ───────────────────────────────────────────────────────
orderbook:
  provider: ${ORDERBOOK_PROVIDER:}

# ── Quant Engine (MSA 분리 시 사용) ─────────────────────────────────────────
quant:
  engine:
    url: ${QUANT_ENGINE_URL:}

# ── Trading Service (MSA 분리 시 사용) ──────────────────────────────────────
trading:
  service:
    url: ${TRADING_SERVICE_URL:}
