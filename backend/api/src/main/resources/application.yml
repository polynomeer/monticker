spring:
  application:
    name: monticker-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monticker}
    username: ${DB_USER:monticker}
    password: ${DB_PASSWORD:monticker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate: {}
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true
  batch:
    jdbc:
      initialize-schema: never   # V17 Flyway 마이그레이션으로 관리
    job:
      enabled: false             # 기동 시 자동 실행 방지 — BatchJobScheduler가 직접 실행
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: ${MONGODB_URI:mongodb://monticker:monticker@localhost:27017/monticker?authSource=admin}
    elasticsearch:
      uris: ${ELASTICSEARCH_URI:http://localhost:9200}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all           # 모든 ISR 확인 후 ACK — 유실 방지
      retries: 3
      properties:
        enable.idempotence: true   # 프로듀서 멱등성 (중복 발행 방지)
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: monticker-api
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM:noreply@monticker.io}
  base-url: ${APP_BASE_URL:http://localhost:3000}

jwt:
  secret: monticker-dev-secret-key-must-be-at-least-32-bytes-long
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

otel:
  service:
    name: monticker-api

# ── Order Book Provider ───────────────────────────────────────────────────────
orderbook:
  provider: ${ORDERBOOK_PROVIDER:}

# ── Quant Engine (MSA 분리 시 사용) ─────────────────────────────────────────
quant:
  engine:
    url: ${QUANT_ENGINE_URL:}

# ── Trading Service (MSA 분리 시 사용) ──────────────────────────────────────
trading:
  service:
    url: ${TRADING_SERVICE_URL:}
