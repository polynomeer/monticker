spring:
  application:
    name: monticker-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monticker}
    username: ${DB_USER:monticker}
    password: ${DB_PASSWORD:monticker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate: {}
  flyway:
    enabled: true
    locations: classpath:db/migration
    repair-on-migrate: true
  batch:
    jdbc:
      initialize-schema: never   # V17 Flyway 마이그레이션으로 관리
    job:
      enabled: false             # 기동 시 자동 실행 방지 — BatchJobScheduler가 직접 실행
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: monticker-api
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

jwt:
  secret: monticker-dev-secret-key-must-be-at-least-32-bytes-long
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

otel:
  service:
    name: monticker-api

# ── Order Book Provider ───────────────────────────────────────────────────────
# KIS_REALTIME 우선 (worker Redis 캐시), 없으면 설정된 provider fallback
# 값: yahoo  → Yahoo Finance 15분 지연 (계좌 불필요)
#     (미설정) → Mock (순수 랜덤)
orderbook:
  provider: ${ORDERBOOK_PROVIDER:}

# ── Quant Engine (MSA 분리 시 사용) ─────────────────────────────────────────
# 설정 시 analytics/quant/backtest 요청을 quant-engine 서비스로 위임한다.
# 비워두면(기본값) 단일 프로세스 모드로 로컬 서비스를 직접 호출한다.
quant:
  engine:
    url: ${QUANT_ENGINE_URL:}

# ── Trading Service (MSA 분리 시 사용) ──────────────────────────────────────
# 설정 시 paper/matching/wallet 요청을 trading-service로 위임한다.
trading:
  service:
    url: ${TRADING_SERVICE_URL:}
