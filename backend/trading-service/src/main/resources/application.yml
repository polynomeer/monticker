spring:
  application:
    name: monticker-trading-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monticker}
    username: ${DB_USER:monticker}
    password: ${DB_PASSWORD:monticker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  batch:
    job:
      enabled: false  # 스케줄러가 직접 트리거 — 시작 시 자동 실행 방지

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # resilience-plan §A3 / P0-6 — readiness가 실제 서빙 가능 여부를 본다.
      # 설정이 없으면 Spring 기본값(readinessState만)이라 DB가 죽어도 pod는 Ready로 남아
      # 트래픽을 계속 받는다. db는 readiness에만 넣는다 — liveness에 넣으면 DB 장애가
      # pod 재시작 루프를 유발해 복구가 더 느려진다. liveness는 프로세스 생존만 본다.
      probes:
        enabled: true        # K8s 밖(docker-compose)에서도 /readiness, /liveness 노출
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: monticker-trading-service
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

kafka:
  brokers: ${KAFKA_BROKERS:localhost:9092}
