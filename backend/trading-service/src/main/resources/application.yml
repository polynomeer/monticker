spring:
  application:
    name: monticker-trading-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monticker}
    username: ${DB_USER:monticker}
    password: ${DB_PASSWORD:monticker}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: false
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  batch:
    job:
      enabled: false  # 스케줄러가 직접 트리거 — 시작 시 자동 실행 방지

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: monticker-trading-service
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

kafka:
  brokers: ${KAFKA_BROKERS:localhost:9092}
